# Local or VPS stack: Postgres + the site.
#   Database only (for `pnpm dev`):  docker compose up -d db
#   Everything:                      docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nr}
      POSTGRES_DB: ${POSTGRES_DB:-nrproperty}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nr}']
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      network: host
      args:
        DATABASE_URL: postgres://${POSTGRES_USER:-nr}:${POSTGRES_PASSWORD:-nr}@localhost:5432/${POSTGRES_DB:-nrproperty}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nr}:${POSTGRES_PASSWORD:-nr}@db:5432/${POSTGRES_DB:-nrproperty}
    ports:
      - '3000:3000'
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
